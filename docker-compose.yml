services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smirkly_chat
      POSTGRES_USER: smirkly_chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smirkly_chat}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smirkly_chat -d smirkly_chat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - chat-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  smirkly-chat:
    profiles: ["prod"]
    platform: linux/amd64
    build:
      context: .
      target: prod
    image: smirkly-chat:prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SMIRKLY_CHAT_PORT:-8081}:8080"
      - "${SMIRKLY_CHAT_MONITOR_PORT:-8082}:8082"
    environment:
      SECDIST_CONFIG: ${SECDIST_CONFIG:?SECDIST_CONFIG is required}
    volumes:
      - ${SMIRKLY_CHAT_CONFIG_VARS_PATH:-./configs/config_vars.prod.yaml}:/app/configs/config_vars.yaml:ro

volumes:
  chat-pgdata:
  chat-redisdata:
